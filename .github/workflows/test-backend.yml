name: Test Backend

on:
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    container: maven:3.9.9-eclipse-temurin-21

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: lazybit/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: --name=minio --health-cmd "curl http://localhost:9000/minio/health/live"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flyway
        uses: red-gate/setup-flyway@v1
        with:
          architecture: 'java'

      - name: Run Flyway migrations
        run: |
          flyway migrate \
            -url="jdbc:postgresql://db:5432/postgres" \
            -user=postgres \
            -password=password \
            -locations="filesystem:./backend/src/main/resources/db/migration" \
            -outOfOrder=true

      - name: Install MinIO Client
        run: |
          curl https://dl.min.io/client/mc/release/linux-amd64/mc --output /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: Setup MinIO bucket
        run: |
          ./mc alias set minio http://minio:9000 minioadmin minioadmin
          ./mc mb --ignore-existing minio/csd-data

      - name: Run tests
        run: mvn verify -Djooq.jdbc.url=jdbc:postgresql://db:5432/postgres -Djooq.jdbc.user=postgres -Djooq.jdbc.password=password
        working-directory: ./backend
