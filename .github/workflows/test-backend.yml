name: Test Backend

on:
  pull_request:
    branches: [dev]

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: maven:3.9.9-eclipse-temurin-21

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flyway
        uses: red-gate/setup-flyway@v1
        with:
          architecture: 'java'

      - name: Run Flyway migrations
        run: |
          flyway migrate \
            -url="jdbc:postgresql://db:5432/postgres" \
            -user=postgres \
            -password=password \
            -locations="filesystem:./backend/src/main/resources/db/migration" \
            -outOfOrder=true

      - name: Run tests with coverage
        env:
          GOOGLE_API_KEY: dummy_key
        run: mvn verify jacoco:report -Djooq.jdbc.url=jdbc:postgresql://db:5432/postgres -Djooq.jdbc.user=postgres -Djooq.jdbc.password=password
        working-directory: ./backend

      - name: Generate coverage summary
        run: |
          echo "## 📊 Test Coverage Report" > coverage-summary.md
          echo "" >> coverage-summary.md
          echo "| Metric | Coverage |" >> coverage-summary.md
          echo "|--------|----------|" >> coverage-summary.md
          if [ -f backend/target/site/jacoco/jacoco.csv ]; then
            # Get the last line which contains overall coverage (or use the aggregated total)
            while IFS=, read -r GROUP INSTRUCTION_COVERED INSTRUCTION_MISSED BRANCH_COVERED BRANCH_MISSED LINE_COVERED LINE_MISSED COMPLEXITY_COVERED COMPLEXITY_MISSED METHOD_COVERED METHOD_MISSED; do
              INSTRUCTION_TOTAL=$((INSTRUCTION_COVERED + INSTRUCTION_MISSED))
              if [ $INSTRUCTION_TOTAL -gt 0 ]; then
                INSTRUCTION_PERCENT=$((INSTRUCTION_COVERED * 100 / INSTRUCTION_TOTAL))
              fi

              BRANCH_TOTAL=$((BRANCH_COVERED + BRANCH_MISSED))
              if [ $BRANCH_TOTAL -gt 0 ]; then
                BRANCH_PERCENT=$((BRANCH_COVERED * 100 / BRANCH_TOTAL))
              fi

              LINE_TOTAL=$((LINE_COVERED + LINE_MISSED))
              if [ $LINE_TOTAL -gt 0 ]; then
                LINE_PERCENT=$((LINE_COVERED * 100 / LINE_TOTAL))
              fi
            done < backend/target/site/jacoco/jacoco.csv

            echo "| Instructions | ${INSTRUCTION_PERCENT}% |" >> coverage-summary.md
            echo "| Branches | ${BRANCH_PERCENT}% |" >> coverage-summary.md
            echo "| Lines | ${LINE_PERCENT}% |" >> coverage-summary.md
          else
            echo "| Instructions | N/A |" >> coverage-summary.md
            echo "| Branches | N/A |" >> coverage-summary.md
            echo "| Lines | N/A |" >> coverage-summary.md
          fi
          echo "" >> coverage-summary.md
          echo "*Coverage generated by [JaCoCo](https://www.jacoco.org/jacoco/trunk/doc/)*" >> coverage-summary.md
        working-directory: ./backend

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverageReport = fs.readFileSync('backend/coverage-summary.md', 'utf8');

            // Find existing coverage comment to update instead of creating new ones
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 Test Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: coverageReport
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: coverageReport
              });
            }
