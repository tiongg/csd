name: Deploy Backend to fly

on:
  push:
    branches:
      - prod
      - ci/*

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    environment: prod
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions@1.5
        with:
          args: >
            deploy
            --remote-only
            --config ../.fly/fly-backend.toml
            --build-arg JOOQ_JDBC_URL=${{ vars.SPRING_DATASOURCE_URL }}
            --build-arg JOOQ_JDBC_USER=${{ vars.SPRING_DATASOURCE_USERNAME }}
            --build-arg JOOQ_JDBC_PASSWORD=${{ vars.SPRING_DATASOURCE_PASSWORD }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_BACKEND }}
