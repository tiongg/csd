name: Deploy Y Websocket to fly

on:
  push:
    branches:
      - prod
      - ci/*

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./external-services
    environment: prod
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config ./.fly/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_WS }}
