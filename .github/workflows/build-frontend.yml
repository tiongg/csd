name: Build Frontend

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  # Env doesnt really matter since we are just building the frontend, but we need to set it to avoid build errors
  VITE_BACKEND_URL: http://localhost:8080
  VITE_WS_URL: ws://localhost:8081

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
