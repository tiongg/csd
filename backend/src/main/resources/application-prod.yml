spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jooq:
    sql-dialect: POSTGRES
  cloud:
    config:
      server:
        awss3:
          region: ${S3_REGION:us-east-1}
          bucket: ${S3_BUCKET:csd-data}
          access-key: ${S3_ACCESS_KEY:minioadmin}
          secret-key: ${S3_SECRET_KEY:minioadmin}
          endpoint: ${S3_ENDPOINT:http://localhost:9000}
          private_endpoint: ${S3_ENDPOINT:http://minio:9000}
          path-style-access: ${S3_PATH_STYLE_ACCESS:true}

jwt:
  secret: ${JWT_SECRET:shikanokonokonokokoshitantanshikanokonokonokokoshitantanshikanokonokonokokoshitantan}
  # In hours
  access-token:
    expiration: 1
  refresh-token:
    expiration: 720

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
