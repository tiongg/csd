# fly.toml app configuration file generated for sixsevennn-ws on 2026-03-10T09:57:23+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sixsevennn-ws'
primary_region = 'sin'

[build]
  dockerfile = "../yws.Dockerfile"
  
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[env]
  PORT = "3000"
  HOST = "0.0.0.0'"
  YPERSISTENCE = "/persistence"

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[mounts]
  source = "persistence"
  destination = "/persistence"

